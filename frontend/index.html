<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app__header">
      <h1>Todo List</h1>
      <p class="app__subtitle">A small app used to learn Docker step by step.</p>
    </header>

    <!-- Stats -->
    <section class="stats" aria-label="Task statistics">
      <div class="stat">
        <span class="stat__number" id="stat-total">0</span>
        <span class="stat__label">Total</span>
      </div>
      <div class="stat">
        <span class="stat__number" id="stat-completed">0</span>
        <span class="stat__label">Completed</span>
      </div>
      <div class="stat">
        <span class="stat__number" id="stat-remaining">0</span>
        <span class="stat__label">Remaining</span>
      </div>
    </section>

    <!-- Create / Edit form -->
    <section class="panel">
      <h2 id="form-title" class="panel__title">New Task</h2>

      <form id="task-form" novalidate>
        <input type="hidden" id="task-id" />

        <div class="field">
          <label for="title">Title <span class="required">*</span></label>
          <input type="text" id="title" name="title" maxlength="255"
                 placeholder="e.g. Learn Docker volumes" required />
          <small class="error" id="error-title"></small>
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3"
                    placeholder="Optional details about the task"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="field">
            <label for="due_date">Due date</label>
            <input type="date" id="due_date" name="due_date" />
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn--primary" id="submit-btn">Add Task</button>
          <button type="button" class="btn btn--ghost hidden" id="cancel-btn">Cancel</button>
        </div>
      </form>
    </section>

    <!-- Toolbar -->
    <section class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="completed">Completed</button>
      </div>

      <div class="sorts">
        <label for="sort">Sort by</label>
        <select id="sort">
          <option value="created_desc">Newest first</option>
          <option value="created_asc">Oldest first</option>
          <option value="priority_desc">Priority (high &rarr; low)</option>
          <option value="priority_asc">Priority (low &rarr; high)</option>
          <option value="due_asc">Due date (soonest)</option>
          <option value="due_desc">Due date (latest)</option>
        </select>
      </div>
    </section>

    <!-- List -->
    <section class="panel">
      <div id="loading" class="message hidden">Loading tasks&hellip;</div>
      <div id="error-banner" class="message message--error hidden"></div>
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="message hidden">
        No tasks here yet. Add your first task above.
      </div>
    </section>

    <footer class="app__footer">
      <span id="mode-badge" class="badge">connecting&hellip;</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
